name: Conversion tracking tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/all-whatsapp-conversion-accounts]

jobs:
  conversion-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
